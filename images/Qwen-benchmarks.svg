<text x="593.0" y="164" class="t1" font-size="11.5" font-weight="600">86.6</text>
<text x="680" y="158" class="t1" font-size="12.5" font-weight="700">+4.5</text>
<text x="193" y="202" class="t1" font-size="12.5" font-weight="700" text-anchor="end">GPQA Diamond</text>
<text x="193" y="218" class="t2" font-size="10.5" text-anchor="end">graduate-level science questions</text>
<path d="M 205.0,190 H 593.5 A 4,4 0 0 1 597.5,194 V 202 A 4,4 0 0 1 593.5,206 H 205.0 Z" class="s-qwen"/>
<text x="604.5" y="202" class="t1" font-size="11.5" font-weight="600">89.2</text>
<path d="M 205.0,208 H 602.7 A 4,4 0 0 1 606.7,212 V 220 A 4,4 0 0 1 602.7,224 H 205.0 Z" class="s-opus"/>
<text x="613.7" y="220" class="t1" font-size="11.5" font-weight="600">91.3</text>
<text x="680" y="214" class="t1" font-size="12.5" font-weight="700">−2.1</text>
<text x="193" y="258" class="t1" font-size="12.5" font-weight="700" text-anchor="end">Terminal-Bench 2.1</text>
<text x="193" y="274" class="t2" font-size="10.5" text-anchor="end">agent tasks in a real terminal</text>
<path d="M 205.0,246 H 522.2 A 4,4 0 0 1 526.2,250 V 258 A 4,4 0 0 1 522.2,262 H 205.0 Z" class="s-qwen"/>
<text x="533.2" y="258" class="t1" font-size="11.5" font-weight="600">73.0</text>
<path d="M 205.0,264 H 545.1 A 4,4 0 0 1 549.1,268 V 276 A 4,4 0 0 1 545.1,280 H 205.0 Z" class="s-opus"/>
<text x="556.1" y="276" class="t1" font-size="11.5" font-weight="600">78.2</text>
<text x="680" y="270" class="t1" font-size="12.5" font-weight="700">−5.2</text>
<text x="193" y="314" class="t1" font-size="12.5" font-weight="700" text-anchor="end">Humanity&#39;s Last Exam</text>
<text x="193" y="330" class="t2" font-size="10.5" text-anchor="end">expert questions, many fields</text>
<path d="M 205.0,302 H 336.5 A 4,4 0 0 1 340.5,306 V 314 A 4,4 0 0 1 336.5,318 H 205.0 Z" class="s-qwen"/>
<text x="347.5" y="314" class="t1" font-size="11.5" font-weight="600">30.8</text>
<path d="M 205.0,320 H 377.0 A 4,4 0 0 1 381.0,324 V 332 A 4,4 0 0 1 377.0,336 H 205.0 Z" class="s-opus"/>
<text x="388.0" y="332" class="t1" font-size="11.5" font-weight="600">40.0</text>
<text x="680" y="326" class="t1" font-size="12.5" font-weight="700">−9.2</text>
<text x="0" y="414" class="t2" font-size="10">All figures as reported on the Qwen3.8-27B model card (August 2026) against the comparator chosen there; not independently reproduced.</text>
</g></svg>