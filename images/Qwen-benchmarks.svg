<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 424" width="800" height="424" role="img" aria-labelledby="qbTitle qbDesc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="qbTitle">Qwen3.8-27B compared with a frontier model across five benchmarks</title>
<desc id="qbDesc">Grouped bar chart. Qwen3.8-27B leads on CharXiv (83.7 vs 66.0) and OmniDocBench 1.5 (91.1 vs 86.6), and trails on GPQA Diamond (89.2 vs 91.3), Terminal-Bench 2.1 (73.0 vs 78.2), and Humanity’s Last Exam (30.8 vs 40.0). Exact values are given in the table below the figure.</desc>
<style>
  .qb{ --qwen:#2a78d6; --opus:#eb6834; --ink:#1f2328; --ink2:#57606a; --grid:#d8dbdf; }
  @media (prefers-color-scheme: dark){
    .qb{ --qwen:#3987e5; --opus:#d95926; --ink:#e8e8e6; --ink2:#b0b3b8; --grid:#3a3d42; }
  }
  body.quarto-dark .qb, .quarto-dark .qb{
    --qwen:#3987e5; --opus:#d95926; --ink:#e8e8e6; --ink2:#b0b3b8; --grid:#3a3d42;
  }
  .qb .s-qwen{ fill:var(--qwen); }
  .qb .s-opus{ fill:var(--opus); }
  .qb .t1{ fill:var(--ink); }
  .qb .t2{ fill:var(--ink2); }
  .qb .gl{ stroke:var(--grid); stroke-width:1; }
  .qb .base{ stroke:var(--ink2); stroke-width:1; }
</style>
<g class="qb">
<text x="0" y="20" class="t1" font-size="15.5" font-weight="700">Qwen3.8-27B against a frontier model</text>
<rect x="0" y="36" width="11" height="11" rx="2.5" class="s-qwen"/>
<text x="17" y="45.5" class="t1" font-size="12">Qwen3.8-27B &#183; 27B dense, runs on one GPU</text>
<rect x="350" y="36" width="11" height="11" rx="2.5" class="s-opus"/>
<text x="367" y="45.5" class="t1" font-size="12">Claude Opus 4.6 Max &#183; size not published</text>
<line x1="205.0" y1="70" x2="205.0" y2="350" class="base"/>
<text x="205.0" y="368" class="t2" font-size="11" text-anchor="middle">0</text>
<line x1="315.0" y1="70" x2="315.0" y2="350" class="gl"/>
<text x="315.0" y="368" class="t2" font-size="11" text-anchor="middle">25</text>
<line x1="425.0" y1="70" x2="425.0" y2="350" class="gl"/>
<text x="425.0" y="368" class="t2" font-size="11" text-anchor="middle">50</text>
<line x1="535.0" y1="70" x2="535.0" y2="350" class="gl"/>
<text x="535.0" y="368" class="t2" font-size="11" text-anchor="middle">75</text>
<line x1="645.0" y1="70" x2="645.0" y2="350" class="gl"/>
<text x="645.0" y="368" class="t2" font-size="11" text-anchor="middle">100</text>
<text x="425.0" y="384" class="t2" font-size="10.5" text-anchor="middle">benchmark score (higher is better)</text>
<text x="193" y="90" class="t1" font-size="12.5" font-weight="700" text-anchor="end">CharXiv (reasoning)</text>
<text x="193" y="106" class="t2" font-size="10.5" text-anchor="end">reasoning over scientific figures</text>
<path d="M 205.0,78 H 569.3 A 4,4 0 0 1 573.3,82 V 90 A 4,4 0 0 1 569.3,94 H 205.0 Z" class="s-qwen"/>
<text x="580.3" y="90" class="t1" font-size="11.5" font-weight="600">83.7</text>
<path d="M 205.0,96 H 491.4 A 4,4 0 0 1 495.4,100 V 108 A 4,4 0 0 1 491.4,112 H 205.0 Z" class="s-opus"/>
<text x="502.4" y="108" class="t1" font-size="11.5" font-weight="600">66.0</text>
<text x="680" y="102" class="t1" font-size="12.5" font-weight="700">+17.7</text>
<text x="193" y="146" class="t1" font-size="12.5" font-weight="700" text-anchor="end">OmniDocBench 1.5</text>
<text x="193" y="162" class="t2" font-size="10.5" text-anchor="end">parsing real PDF pages end to end</text>
<path d="M 205.0,134 H 601.8 A 4,4 0 0 1 605.8,138 V 146 A 4,4 0 0 1 601.8,150 H 205.0 Z" class="s-qwen"/>
<text x="612.8" y="146" class="t1" font-size="11.5" font-weight="600">91.1</text>
