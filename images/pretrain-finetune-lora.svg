<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" font-family="Helvetica, Arial, sans-serif" font-size="16">
<rect width="1080" height="440" fill="#ffffff"/>
<text x="480" y="34" text-anchor="middle" font-weight="bold" font-size="22">GPU-hours to get a 3B model that does a task, on a log scale</text>
<line x1="50" y1="360" x2="940" y2="360" stroke="#444" stroke-width="1.5"/>
<line x1="50" y1="360" x2="50" y2="366" stroke="#444"/>
<text x="50" y="384" text-anchor="middle" font-size="13">0.1</text>
<line x1="161" y1="360" x2="161" y2="366" stroke="#444"/>
<text x="161" y="384" text-anchor="middle" font-size="13">1</text>
<line x1="161" y1="90" x2="161" y2="360" stroke="#eee"/>
<line x1="272" y1="360" x2="272" y2="366" stroke="#444"/>
<text x="272" y="384" text-anchor="middle" font-size="13">10</text>
<line x1="272" y1="90" x2="272" y2="360" stroke="#eee"/>
<line x1="384" y1="360" x2="384" y2="366" stroke="#444"/>
<text x="384" y="384" text-anchor="middle" font-size="13">100</text>
<line x1="384" y1="90" x2="384" y2="360" stroke="#eee"/>
<line x1="495" y1="360" x2="495" y2="366" stroke="#444"/>
<text x="495" y="384" text-anchor="middle" font-size="13">1,000</text>
<line x1="495" y1="90" x2="495" y2="360" stroke="#eee"/>
<line x1="606" y1="360" x2="606" y2="366" stroke="#444"/>
<text x="606" y="384" text-anchor="middle" font-size="13">10,000</text>
<line x1="606" y1="90" x2="606" y2="360" stroke="#eee"/>
<line x1="718" y1="360" x2="718" y2="366" stroke="#444"/>
<text x="718" y="384" text-anchor="middle" font-size="13">100,000</text>
<line x1="718" y1="90" x2="718" y2="360" stroke="#eee"/>
<line x1="829" y1="360" x2="829" y2="366" stroke="#444"/>
<text x="829" y="384" text-anchor="middle" font-size="13">1 million</text>
<line x1="829" y1="90" x2="829" y2="360" stroke="#eee"/>
<line x1="940" y1="360" x2="940" y2="366" stroke="#444"/>
<text x="940" y="384" text-anchor="middle" font-size="13">10 million</text>
<line x1="940" y1="90" x2="940" y2="360" stroke="#eee"/>
<text x="495" y="406" text-anchor="middle" font-size="14">GPU-hours (each step to the right is ten times more)</text>
<text x="50" y="92" font-weight="bold" font-size="17">Training from scratch</text>
<text x="275" y="92" font-size="14" fill="#555">Llama 3.2 3B, every weight from random</text>
<rect x="50" y="100" width="741" height="34" fill="#fdae6b" stroke="#444"/>
<text x="60" y="123" font-size="14">460,000 GPU-hours: about a thousand H100s for three weeks, ~300 MWh</text>
<text x="50" y="178" font-weight="bold" font-size="17">Full fine-tuning</text>
<text x="275" y="178" font-size="14" fill="#555">CHURRO-3B, every weight from Qwen2.5-VL-3B</text>
<rect x="50" y="186" width="434" height="34" fill="#fdae6b" stroke="#444"/>
<text x="494" y="209" font-size="14">800 GPU-hours: eight H100s for four days, ~500 kWh</text>
<text x="50" y="264" font-weight="bold" font-size="17">LoRA fine-tuning</text>
<text x="275" y="264" font-size="14" fill="#555">this episode, an adapter under 1% of the weights</text>
<rect x="50" y="272" width="81" height="34" fill="#fdae6b" stroke="#444"/>
<text x="141" y="295" font-size="14">0.5 GPU-hours: one A10G for 32 minutes, ~0.2 kWh</text>
<text x="50" y="430" font-size="13" fill="#555">Sources: Llama 3.2 model card (training time); CHURRO paper; this episode's job record. Energy is GPU electricity alone at the card's rated draw, so a lower bound.</text>
</svg>