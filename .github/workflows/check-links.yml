# -------------------------------------------------------------------------------------
# GitHub Actions Workflow: Check for Broken Links on GitHub Pages Site
# -------------------------------------------------------------------------------------
# This file defines a GitHub Actions *workflow* — a full automation process.
# It includes triggers (when it runs), and jobs (what it does).
#
# Inside the job, we *use an action* — a reusable piece of automation that handles 
# one task (in this case, link checking).
#
# Reminder: Workflows are made up of jobs, and jobs are made up of steps. 
# Steps often *use actions*, which are prebuilt helper tools.

name: Check for broken links  # Workflow name (appears in GitHub's Actions UI)

on:
  # Allows this workflow to be run manually from the GitHub UI
  workflow_dispatch:

  # Automatically run this workflow *after* the GitHub Pages site has been built and deployed.
  # The `pages-build-deployment` workflow is automatically created by GitHub when Pages is enabled.
  workflow_run:
    workflows:
      - pages-build-deployment
    types:
      - completed  # Only trigger after that deployment workflow finishes

  # Scheduled run using cron syntax (minute hour day month weekday)
  schedule:
    - cron: '49 11 * * 1'  # Run every Monday at 11:49 UTC (6:49 AM CDT)

# -------------------------------------------------------------------------------------
# Job: A self-contained unit of work run on a specific virtual machine (runner).
# -------------------------------------------------------------------------------------
jobs:
  check_links:
    # When started by a Pages deployment, run only if that deployment succeeded; a
    # cancelled or failed deployment leaves the old site up and nothing new to check.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    name: Check links on the published site

    steps:
      # The published site lives on the gh-pages branch, so check that copy of the HTML:
      # relative links between pages are verified against the files themselves, and
      # external links are fetched over the network.
      - name: Check out the published site (gh-pages branch)
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      # lychee (https://github.com/lycheeverse/lychee) replaces the earlier crawler. The
      # difference that matters: it can treat a server's temporary trouble (rate limiting,
      # 5xx errors, bot-blocking 403s) as acceptable, so the job fails only for links that
      # are dead (404, 410, unresolvable hosts) rather than for every site having a bad hour.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          # Authenticated github.com requests get a far higher rate limit.
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
          args: >-
            --no-progress
            --max-concurrency 6
            --max-retries 3
            --retry-wait-time 10
            --timeout 30
            --accept '200..=206,403,429,500..=599'
            --exclude-path site_libs
            --exclude-path Contributor-templates
            --exclude '\.qmd$'
            --exclude '^https://www\.biorxiv\.org/content/10\.1101/2024\.03\.15\.585128v1'
            --exclude '^https://techcommunity\.microsoft\.com/blog/healthcareandlifesciencesblog/discovering-the-power-of-finetuning-medimageinsight-on-your-data/4395057'
            --exclude '^https://dl\.acm\.org/doi/10\.1145/3065386'
            --exclude '^https://openai\.com/research/'
            --exclude '^https://www\.sciencedirect\.com/science/article/abs/pii/S0168169922006603'
            --exclude '^https://www\.kaggle\.com/'
            --exclude '^https://mediaspace\.wisc\.edu/'
            --exclude '^https://kb\.wisc\.edu/'
            --exclude '^https://vimeo\.com/'
            --exclude '^https://player\.vimeo\.com/'
            --exclude '^https://it\.wisc\.edu/exploring-artificial-intelligence-uw-madison/'
            --exclude '^https://cacm\.acm\.org/'
            --exclude '^https://opportunitydesk\.org/'
            --exclude '^https://www\.carbonbrief\.org/'
            --exclude '^https://jeffry\.in/'
            --exclude '^https://claude\.ai'
            --exclude '^https://www\.iea\.org/'
            --exclude '^https://www\.fastcompany\.com/'
            --exclude '^https://www\.sitepoint\.com/'
            --exclude '^https://console\.cloud\.google\.com/'
            --exclude '^https://www\.linkedin\.com/'
            --exclude '^https://devops\.com/'
            --exclude '^https://openai\.com/index/'
            --exclude '^https://www\.gbif\.org/'
            --exclude '^https://venturebeat\.com/'
            --exclude '^https://console\.aws\.amazon\.com/'
            --exclude '^https://monai\.io/'
            --exclude '^https://researchci\.it\.wisc\.edu/'
            --exclude '^https://marketplace\.visualstudio\.com/'
            --exclude '^https://doi\.org/10\.1002/eap\.2694'
            --exclude '^https://doi\.org/10\.3390/'
            --exclude '^https://www\.mdpi\.com/'
            --exclude '^https://canvas\.wisc\.edu/enroll/'
            --exclude '^https://zenodo\.org/'
            --exclude '^https://lmarena\.ai/'
            --exclude '^https://dvc\.org/'
            --exclude '^https://blog\.1password\.com/'
            --exclude '^https://profile\.wisc\.edu/'
            --exclude '^https://www\.cursor\.com/'
            --exclude '^https://engineering\.wisc\.edu/directory/'
            --exclude '^https://hastie\.su\.domains/'
            --exclude '^https://incommon\.org/'
            --exclude '^http://inquire-demo\.csail\.mit\.edu/'
            --exclude '^https://www\.dell\.com/'
            --exclude '^https://www\.promega\.com/'
            --exclude '^https://www\.warf\.org/'
            '**/*.html'
